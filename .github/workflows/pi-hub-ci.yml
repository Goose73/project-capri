name: Raspberry Pi Hub CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  hub-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore hub tests
        run: dotnet restore tests/Capri.Hub.Tests/Capri.Hub.Tests.csproj
      - name: Test hub on Linux
        run: dotnet test tests/Capri.Hub.Tests/Capri.Hub.Tests.csproj -c Release --no-restore
      - name: Publish Pi 4 ARM64 executable
        run: dotnet publish src/Capri.Hub/Capri.Hub.csproj -c Release -r linux-arm64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o out/pi-hub
      - name: Upload installable ARM64 build
        uses: actions/upload-artifact@v4
        with:
          name: capri-hub-linux-arm64
          path: out/pi-hub/
          if-no-files-found: error
