name: Windows CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# CI only reads source and uploads test artifacts; it never needs write access.
permissions:
  contents: read

# Keep concurrent runs independent so an updated PR cannot cancel evidence
# for an earlier SHA while its checks are still being inspected.
concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Capri.sln

      - name: Build
        run: dotnet build Capri.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/Capri.Tests/Capri.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Safe Release CLI smoke (no provider requests)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (Get-Variable PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) { $PSNativeCommandUseErrorActionPreference = $false }
          $env:CAPRI_DATA_DIR = Join-Path $env:RUNNER_TEMP 'capri-ci-smoke'
          $cli = 'src/Capri.Cli/bin/Release/net10.0-windows/capri.exe'
          & $cli help 2>&1 | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "CLI help failed: $LASTEXITCODE" }
          'no' | & $cli task smoke 2>&1 | Out-String | Write-Host
          if ($LASTEXITCODE -ne 2) { throw "Piped task must refuse with exit 2; got $LASTEXITCODE" }
          'no' | & $cli setup --repair 2>&1 | Out-String | Write-Host
          if ($LASTEXITCODE -ne 2) { throw "Piped setup --repair must refuse with exit 2; got $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: error
